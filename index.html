<!DOCTYPE html>
<html lang="ko">
<head>
  <base href="/familygame/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="패밀리 게임 - 가족이 각자 폰으로 함께하는 파티 게임">
  <meta name="theme-color" content="#FF7A59">

  <!-- 아이폰 홈 화면 추가용 -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="패밀리 게임">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>패밀리 게임</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { margin: 0; height: 100%; background: #FFF7E8; }
    #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
               font-family: sans-serif; color: #3B2F2F; gap: 12px; }
    #loading .dice { font-size: 64px; animation: bounce .8s ease-in-out infinite alternate; }
    #loading .t { font-size: 22px; font-weight: bold; color: #FF7A59; }
    @keyframes bounce { from { transform: translateY(0) rotate(-8deg); } to { transform: translateY(-18px) rotate(8deg); } }
  </style>
</head>
<body>
  <div id="loading"><div class="dice">🎲</div><div class="t">패밀리 게임 준비 중…</div></div>
  <script>
    // 테스트용(?slot=N): Supabase 로그인은 같은 브라우저의 탭끼리 BroadcastChannel 로 공유되므로,
    // PC 한 대에서 창마다 다른 사람을 흉내 낼 때만 채널 이름을 창별로 나눈다. 평소에는 아무 영향 없음.
    (function () {
      var slot = new URLSearchParams(location.search).get('slot');
      if (!slot || !window.BroadcastChannel) return;
      var BC = window.BroadcastChannel;
      window.BroadcastChannel = class extends BC { constructor(name) { super(name + '#slot' + slot); } };
    })();
    window.addEventListener('flutter-first-frame', function () {
      var l = document.getElementById('loading'); if (l) l.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
